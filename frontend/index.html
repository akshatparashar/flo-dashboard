<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>FLO Operations</title>
    <meta name="description" content="Live production, orders, samples, fabric and revenue for FLO." />
    <meta name="theme-color" content="#eef1f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121a2c" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Set the theme before first paint so there is no flash.
      try {
        var t = localStorage.getItem("flo-theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>FLO Operations needs JavaScript to show live data.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
